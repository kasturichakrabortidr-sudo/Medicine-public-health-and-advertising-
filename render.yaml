# Blueprint: New → Blueprint, then set the branch to cursor/live-working-app-8da2.
# Prefer the Dashboard manual Web Service path in the README. Free has no disk.
services:
  - type: web
    name: strata-director
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
