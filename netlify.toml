[build]
  command = "npm --prefix web run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "web/netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm --prefix web run dev"
  targetPort = 5173
  framework = "#custom"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Functions with custom /api paths must be listed before the SPA catch-all
# so the rewrite to index.html cannot swallow live research jobs.
[[redirects]]
  from = "/api/research"
  to = "/.netlify/functions/research-background"
  status = 200
  force = true

[[redirects]]
  from = "/api/research/*"
  to = "/.netlify/functions/research-status/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
