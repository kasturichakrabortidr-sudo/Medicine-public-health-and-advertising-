<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="composite-effect-size-title composite-effect-size-desc"
     viewBox="0 0 920 278" width="920" height="278">
  <title id="composite-effect-size-title">Decision-critical endpoints versus the ACE-inhibitor comparator</title>
  <desc id="composite-effect-size-desc">Relative effect the medical director will be asked to believe — ratios below 1 favour the brand. Source: PARADIGM-HF style composite as described in the example brief — illustrative. MLR: required.</desc>
  <rect width="920" height="278" fill="#F7F4EF"/>
  <rect x="0" y="0" width="8" height="278" fill="#1A7A7A"/>
  <text x="32" y="36" fill="#C4A35A" font-size="11"
        font-family="Helvetica, Arial, sans-serif" letter-spacing="1.6">
    WHAT THE SCIENCE REPRESENTS</text>
  <text x="32" y="64" fill="#0B1F3A" font-size="22"
        font-family="Georgia, 'Times New Roman', serif">Decision-critical endpoints versus the ACE-inhibitor comparator</text>
  <text x="32" y="88" fill="#4A5568" font-size="13"
        font-family="Helvetica, Arial, sans-serif">Relative effect the medical director will be asked to believe — ratios below 1 favour the brand</text>
  <text x="32" y="116" fill="#4A5568" font-size="12" font-family="Helvetica, Arial, sans-serif">Unit: hazard ratio  ·  vs enalapril-class ACE inhibitor</text><line x1="580.0" y1="128" x2="580.0" y2="238" stroke="#C4A35A" stroke-dasharray="3 3"/><text x="586.0" y="126" fill="#C4A35A" font-size="11" font-family="Helvetica, Arial, sans-serif">1.0 (no difference)</text><text x="32" y="148" fill="#0B1F3A" font-size="13" font-family="Helvetica, Arial, sans-serif">CV death or HF hospitalisation</text><text x="32" y="164" fill="#8A8276" font-size="11" font-family="Helvetica, Arial, sans-serif">favours brand  0.73–0.87</text><rect x="300" y="138" width="560" height="16" fill="#D6DEE8" rx="8"/><rect x="524.0" y="138" width="56.0" height="16" fill="#1A7A7A" rx="8"/><text x="532.0" y="152" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">0.8</text><text x="32" y="212" fill="#0B1F3A" font-size="13" font-family="Helvetica, Arial, sans-serif">Cardiovascular death</text><text x="32" y="228" fill="#8A8276" font-size="11" font-family="Helvetica, Arial, sans-serif">favours brand  0.71–0.89</text><rect x="300" y="202" width="560" height="16" fill="#D6DEE8" rx="8"/><rect x="524.0" y="202" width="56.0" height="16" fill="#1A7A7A" rx="8"/><text x="532.0" y="216" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">0.8</text>
  <text x="32" y="260" fill="#8A8276" font-size="11"
        font-family="Helvetica, Arial, sans-serif">Source: PARADIGM-HF style composite as described in the example brief — illustrative  ·  MLR: required</text>
</svg>
