  <title id="science-to-solution-cascade-title">Science to solution through strategy execution</title>
  <desc id="science-to-solution-cascade-desc">Each row is a contract: the picture, the practice change, the field move, the proof. Source: Phases 4, 6, 7 of the example pipeline — illustrative cascade. MLR: not-promotional.</desc>
  <rect width="1100" height="470" fill="#F7F4EF"/>
