  <text x="32" y="36" fill="#C4A35A" font-size="11"
        font-family="Helvetica, Arial, sans-serif" letter-spacing="1.6">
    WHAT THE SCIENCE REPRESENTS</text>
  <text x="32" y="64" fill="#0B1F3A" font-size="22"
        font-family="Georgia, 'Times New Roman', serif">Science to solution through strategy execution</text>
  <text x="32" y="88" fill="#4A5568" font-size="13"
        font-family="Helvetica, Arial, sans-serif">Each row is a contract: the picture, the practice change, the field move, the proof</text>
  <rect x="32" y="108" width="184" height="28" rx="4" fill="#0B1F3A"/><text x="124.0" y="127" text-anchor="middle" fill="#fff" font-size="12" font-family="Helvetica, Arial, sans-serif">SCIENCE</text><polygon points="214,122 226,122 220,128" fill="#C4A35A"/><rect x="228" y="108" width="184" height="28" rx="4" fill="#1A7A7A"/><text x="320.0" y="127" text-anchor="middle" fill="#fff" font-size="12" font-family="Helvetica, Arial, sans-serif">IMPLICATION</text><polygon points="410,122 422,122 416,128" fill="#C4A35A"/><rect x="424" y="108" width="184" height="28" rx="4" fill="#C4A35A"/><text x="516.0" y="127" text-anchor="middle" fill="#fff" font-size="12" font-family="Helvetica, Arial, sans-serif">SOLUTION</text><polygon points="606,122 618,122 612,128" fill="#C4A35A"/><rect x="620" y="108" width="184" height="28" rx="4" fill="#2F6F4E"/><text x="712.0" y="127" text-anchor="middle" fill="#fff" font-size="12" font-family="Helvetica, Arial, sans-serif">EXECUTION</text><polygon points="802,122 814,122 808,128" fill="#C4A35A"/><rect x="816" y="108" width="184" height="28" rx="4" fill="#4A5568"/><text x="908.0" y="127" text-anchor="middle" fill="#fff" font-size="12" font-family="Helvetica, Arial, sans-serif">METRIC</text><text x="32" y="146" fill="#C4A35A" font-size="11" font-family="Helvetica, Arial, sans-serif">C1</text><rect x="32" y="150" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="40" y="166" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Composite benefit vs ACEI</text><text x="40" y="182" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">(patient-impact visual)</text><rect x="228" y="150" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="236" y="166" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Delaying ARNI leaves</text><text x="236" y="182" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">preventable events on the</text><text x="236" y="198" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">table</text><rect x="424" y="150" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="432" y="166" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Initiate foundational</text><text x="432" y="182" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">ARNI once</text><text x="432" y="198" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">haemodynamically stable —</text><text x="432" y="214" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">not after a long ACEI</text><rect x="620" y="150" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="628" y="166" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Launch ward-to-clinic</text><text x="628" y="182" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">initiation protocol + KOL</text><text x="628" y="198" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">case reviews</text><rect x="816" y="150" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="824" y="166" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Share of new HFrEF starts</text><text x="824" y="182" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">on ARNI within 30 days of</text><text x="824" y="198" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">index visit</text><text x="32" y="238" fill="#C4A35A" font-size="11" font-family="Helvetica, Arial, sans-serif">C2</text><rect x="32" y="242" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="40" y="258" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Guideline Class I /</text><text x="40" y="274" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">four-pillar alignment</text><rect x="228" y="242" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="236" y="258" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Peers already have cover;</text><text x="236" y="274" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">the habit is the barrier</text><rect x="424" y="242" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="432" y="258" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Replace &#x27;stabilise</text><text x="432" y="274" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">first on ACEI&#x27; with</text><text x="432" y="290" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">&#x27;stabilise on the</text><text x="432" y="306" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">indicated pillar&#x27;</text><rect x="620" y="242" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="628" y="258" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Peer-to-peer</text><text x="628" y="274" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">&#x27;stabilise</text><text x="628" y="290" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">first&#x27; myth-bust</text><text x="628" y="306" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">using the discordance</text><rect x="816" y="242" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="824" y="258" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">% of target HCPs who</text><text x="824" y="274" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">self-report first-line</text><text x="824" y="290" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">(not late) ARNI use</text><text x="32" y="330" fill="#C4A35A" font-size="11" font-family="Helvetica, Arial, sans-serif">C3</text><rect x="32" y="334" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="40" y="350" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Cost 8–10x generic ARB;</text><text x="40" y="366" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">PAP under-used</text><rect x="228" y="334" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="236" y="350" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Tier-2 physicians are not</text><text x="236" y="366" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">refusing the science —</text><text x="236" y="382" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">they are refusing the</text><text x="236" y="398" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">bill</text><rect x="424" y="334" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="432" y="350" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Make the health-economic</text><text x="432" y="366" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">and affordability path as</text><text x="432" y="382" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">visible as the HR</text><rect x="620" y="334" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="628" y="350" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">Rep + PAP walkthrough for</text><text x="628" y="366" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">high cost-concern</text><text x="628" y="382" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">segments (UCPMP-safe)</text><rect x="816" y="334" width="184" height="80" rx="6" fill="#FFFFFF" stroke="#D9D2C5"/><text x="824" y="350" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">PAP enrolment per 100</text><text x="824" y="366" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">eligible starts; 90-day</text><text x="824" y="382" fill="#0B1F3A" font-size="12" font-family="Helvetica, Arial, sans-serif">persistency</text>
  <text x="32" y="452" fill="#8A8276" font-size="11"
        font-family="Helvetica, Arial, sans-serif">Source: Phases 4, 6, 7 of the example pipeline — illustrative cascade  ·  MLR: not-promotional</text>
</svg>
