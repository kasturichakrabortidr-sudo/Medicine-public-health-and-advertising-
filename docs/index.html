<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicomarketing Strategy Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --sidebar-bg: #112040;
  --sidebar-text: #7A9AB8;
  --sidebar-border: rgba(255,255,255,0.06);
  --sidebar-active-bg: rgba(22,152,150,0.18);
  --sidebar-active: #4DBDBC;
  --sidebar-done: #5A8EA8;
  --text: #18283C;
  --text-2: #4A6278;
  --text-3: #7A95A8;
  --accent: #169896;
  --accent-bg: #E8F4F4;
  --running: #C88A0A;
  --running-bg: #FDF5E0;
  --border: #DEE6EF;
  --input-bg: #F8FAFC;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
  --shadow: 0 2px 12px rgba(0,0,0,0.09);
  --header-bg: #0C1A30;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1624;
    --surface: #0F1E30;
    --sidebar-bg: #080E1C;
    --sidebar-text: #5A7A92;
    --sidebar-border: rgba(255,255,255,0.05);
    --sidebar-active-bg: rgba(22,152,150,0.2);
    --sidebar-active: #3AADAC;
    --sidebar-done: #3A7A8A;
    --text: #C8DCE8;
    --text-2: #6A8CA0;
    --text-3: #3A5A6A;
    --accent: #20B0AF;
    --accent-bg: rgba(32,176,175,0.1);
    --running: #C88A0A;
    --running-bg: rgba(200,138,10,0.12);
    --border: rgba(255,255,255,0.07);
    --input-bg: #070E1A;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
    --header-bg: #050D1A;
  }
}

:root[data-theme="dark"] {
  --bg: #0B1624; --surface: #0F1E30; --sidebar-bg: #080E1C;
  --sidebar-text: #5A7A92; --sidebar-border: rgba(255,255,255,0.05);
  --sidebar-active-bg: rgba(22,152,150,0.2); --sidebar-active: #3AADAC;
  --sidebar-done: #3A7A8A; --text: #C8DCE8; --text-2: #6A8CA0;
  --text-3: #3A5A6A; --accent: #20B0AF; --accent-bg: rgba(32,176,175,0.1);
  --running: #C88A0A; --running-bg: rgba(200,138,10,0.12);
  --border: rgba(255,255,255,0.07); --input-bg: #070E1A;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow: 0 2px 12px rgba(0,0,0,0.4);
  --header-bg: #050D1A;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────── */
.header {
  background: var(--header-bg);
  padding: 0 20px;
  height: 54px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.logo {
  font-family: 'IBM Plex Serif', Georgia, serif;
  font-size: 16px;
  font-weight: 600;
  color: #D8EAF5;
  white-space: nowrap;
  letter-spacing: -0.01em;
}

.logo em { color: var(--accent); font-style: normal; }

.header-api {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.api-badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--sidebar-text);
}

.api-input {
  width: 220px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 5px;
  color: #B8D0E4;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 6px 10px;
  outline: none;
  transition: border-color 0.15s;
}
.api-input::placeholder { color: rgba(255,255,255,0.2); }
.api-input:focus { border-color: var(--accent); }
.api-input.ok { border-color: #2A9A5A; }

/* ── Body ────────────────────────────────────────── */
.app-body { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ─────────────────────────────────────── */
.sidebar {
  width: 232px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

.sidebar-head {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--sidebar-border);
}

.phase-list { flex: 1; overflow-y: auto; padding: 6px 0; }

.phase-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 14px;
  cursor: pointer;
  transition: background 0.12s;
  border-radius: 0;
}

.phase-item:hover { background: rgba(255,255,255,0.03); }
.phase-item.active { background: var(--sidebar-active-bg); }

.phase-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.2);
  flex-shrink: 0;
  margin-top: 4px;
  transition: all 0.2s;
}

.phase-item.running .phase-dot {
  background: var(--running);
  border-color: var(--running);
  animation: pulse 1.1s ease-in-out infinite;
}

.phase-item.done .phase-dot {
  background: var(--accent);
  border-color: var(--accent);
}

.phase-item.active:not(.running):not(.done) .phase-dot {
  border-color: var(--sidebar-active);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.8); opacity: 0.5; }
}

.phase-name {
  font-size: 12px;
  color: var(--sidebar-text);
  line-height: 1.35;
}

.phase-item.running .phase-name { color: var(--running); }
.phase-item.done .phase-name { color: var(--sidebar-done); }
.phase-item.active:not(.running):not(.done) .phase-name { color: var(--sidebar-active); }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--sidebar-border);
  flex-shrink: 0;
}

.prog-track {
  height: 2px;
  background: rgba(255,255,255,0.07);
  border-radius: 1px;
  margin-bottom: 7px;
  overflow: hidden;
}

.prog-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  width: 0%;
  transition: width 0.5s ease;
}

.prog-label { font-size: 11px; color: var(--text-3); }

/* ── Main ─────────────────────────────────────────── */
.main { flex: 1; overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }

/* ── Cards ─────────────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.card-head {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 14px 20px 10px;
  border-bottom: 1px solid var(--border);
}

.card-body { padding: 20px; }

/* ── Form ─────────────────────────────────────────── */
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }

.field label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
}

.field label .req { color: var(--accent); }

.field input,
.field textarea,
.field select {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
  padding: 8px 10px;
  outline: none;
  transition: border-color 0.15s;
  resize: vertical;
}

.field input:focus,
.field textarea:focus { border-color: var(--accent); }

.field .hint { font-size: 11px; color: var(--text-3); }

.toggle-opt {
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  background: none;
  border: none;
  padding: 8px 0 0;
  font-family: inherit;
  text-align: left;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.opt-fields {
  display: none;
  flex-direction: column;
  gap: 14px;
  margin-top: 14px;
}
.opt-fields.open { display: flex; }
.opt-fields .field-row { grid-template-columns: 1fr 1fr; }

/* ── Mode ─────────────────────────────────────────── */
.mode-row { display: flex; gap: 12px; }

.mode-opt {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.14s;
  background: var(--surface);
}

.mode-opt.sel {
  border-color: var(--accent);
  background: var(--accent-bg);
}

.mode-opt input { display: none; }
.mode-title { font-size: 13px; font-weight: 600; color: var(--text); }
.mode-desc { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* ── Run btn ──────────────────────────────────────── */
.run-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  padding: 13px 20px;
  cursor: pointer;
  transition: filter 0.15s;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  letter-spacing: 0.01em;
}

.run-btn:hover:not(:disabled) { filter: brightness(1.08); }
.run-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.run-btn.stop { background: #B84040; }

/* ── Output ───────────────────────────────────────── */
.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab {
  font-size: 11px;
  font-weight: 500;
  padding: 10px 16px;
  cursor: pointer;
  color: var(--text-3);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all 0.13s;
  flex-shrink: 0;
}

.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab.done { color: var(--text-2); }
.tab.running { color: var(--running); }

.panel { display: none; padding: 24px; }
.panel.active { display: block; }

/* ── Markdown ─────────────────────────────────────── */
.md h1 { font-family: 'IBM Plex Serif', serif; font-size: 20px; font-weight: 600; color: var(--text); margin: 0 0 14px; text-wrap: balance; }
.md h2 { font-size: 15px; font-weight: 600; color: var(--text); margin: 22px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.md h3 { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 14px 0 6px; }
.md h4 { font-size: 12px; font-weight: 600; color: var(--text-3); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.06em; }
.md p { font-size: 13.5px; line-height: 1.65; color: var(--text); margin: 0 0 10px; }
.md ul, .md ol { padding-left: 18px; margin: 0 0 10px; }
.md li { font-size: 13.5px; line-height: 1.65; color: var(--text); margin-bottom: 3px; }
.md strong { font-weight: 600; }
.md em { font-style: italic; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
.md code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--accent-bg); color: var(--accent); padding: 1px 5px; border-radius: 3px; }
.md pre { background: var(--input-bg); border-radius: 6px; padding: 14px; overflow-x: auto; margin: 12px 0; }
.md pre code { background: none; padding: 0; font-size: 12px; color: var(--text-2); }
.md blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-2); margin: 12px 0; font-style: italic; }
.md .tbl { overflow-x: auto; margin: 14px 0; }
.md table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.md th { background: var(--accent-bg); color: var(--accent); font-weight: 600; text-align: left; padding: 8px 10px; border: 1px solid var(--border); }
.md td { padding: 7px 10px; border: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
.md tr:nth-child(even) td { background: var(--bg); }

.cursor::after { content: '▋'; color: var(--accent); animation: blink 0.9s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ── Error / notice ───────────────────────────────── */
.notice {
  border-radius: 7px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.5;
}
.notice.err { background: rgba(190,40,40,0.1); border: 1px solid rgba(190,40,40,0.25); color: #C04040; }
.notice.info { background: var(--accent-bg); border: 1px solid rgba(22,152,150,0.2); color: var(--accent); }

/* ── Download ─────────────────────────────────────── */
.dl-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 14px;
  cursor: pointer;
  transition: filter 0.15s;
}
.dl-btn:hover { filter: brightness(1.1); }

.out-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-top: 1px solid var(--border);
}

/* ── Mobile ───────────────────────────────────────── */
@media (max-width: 680px) {
  .sidebar { display: none; }
  .main { padding: 16px; gap: 14px; }
  .field-row { grid-template-columns: 1fr; }
  .opt-fields .field-row { grid-template-columns: 1fr; }
  .mode-row { flex-direction: column; }
  .api-input { width: 160px; }
  .api-badge { display: none; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="logo">💊 <em>Medicomarketing</em> Strategy Agent</div>
  <div class="header-api">
    <span class="api-badge">API Key</span>
    <input class="api-input" id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
  </div>
</header>

<div class="app-body">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-head">Pipeline</div>
    <div class="phase-list" id="phaseList"></div>
    <div class="sidebar-footer">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-label" id="progLabel">0 of 11 phases</div>
    </div>
  </nav>

  <!-- Main -->
  <main class="main" id="main">

    <!-- Brief form -->
    <div class="card" id="formCard">
      <div class="card-head">Client Brief</div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:16px;">

        <div class="field-row">
          <div class="field">
            <label>Brand name <span class="req">*</span></label>
            <input id="brand" placeholder="e.g. CardioShield" type="text">
          </div>
          <div class="field">
            <label>Therapy area <span class="req">*</span></label>
            <input id="therapy_area" placeholder="e.g. Cardiology – heart failure" type="text">
          </div>
        </div>

        <button class="toggle-opt" onclick="toggleOpt(this)">
          <span>▸</span> Optional details (more detail = better output)
        </button>

        <div class="opt-fields" id="optFields">
          <div class="field-row">
            <div class="field">
              <label>Product / molecule</label>
              <input id="product" placeholder="e.g. sacubitril/valsartan" type="text">
            </div>
            <div class="field">
              <label>Indication / patient group</label>
              <input id="indication" placeholder="e.g. HFrEF, NYHA class II–IV" type="text">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Market / country</label>
              <input id="market" placeholder="e.g. India – metro + tier-2/3" type="text">
            </div>
            <div class="field">
              <label>Business goal</label>
              <input id="business_goal" placeholder="e.g. Grow prescriptions 15% per quarter" type="text">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Target specialties <span class="hint">(one per line)</span></label>
              <textarea id="target_specialties" rows="3" placeholder="Cardiologists&#10;Consultant physicians&#10;GP referrers"></textarea>
            </div>
            <div class="field">
              <label>HCP segments <span class="hint">(one per line)</span></label>
              <textarea id="hcp_segments" rows="3" placeholder="KOL academic cardiologists&#10;Senior private-practice cardiologists"></textarea>
            </div>
          </div>
          <div class="field">
            <label>Key evidence you hold <span class="hint">(one per line)</span></label>
            <textarea id="brand_evidence" rows="3" placeholder="PARADIGM-HF RCT: significant CV death reduction vs enalapril&#10;Local RWE study (n=1,200) – tolerability in Indian patients"></textarea>
          </div>
          <div class="field">
            <label>HCP insights from advisors / field <span class="hint">(one per line)</span></label>
            <textarea id="hcp_insights" rows="3" placeholder="Advisory board: agree with early initiation but wait to stabilise first&#10;Field notes: monthly cost is top barrier in tier-2"></textarea>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Competitors <span class="hint">(one per line)</span></label>
              <textarea id="competitors" rows="2" placeholder="Generic ACE inhibitors / ARBs&#10;SGLT2 inhibitors"></textarea>
            </div>
            <div class="field">
              <label>Constraints <span class="hint">(one per line)</span></label>
              <textarea id="constraints" rows="2" placeholder="Full UCPMP compliance&#10;4-quarter campaign, 60 reps, 22 cities"></textarea>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Mode + run -->
    <div class="card">
      <div class="card-head">Run Mode</div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:14px;">
        <div class="mode-row">
          <label class="mode-opt sel" id="modeQuick" onclick="setMode('quick')">
            <div class="mode-title">Quick test</div>
            <div class="mode-desc">Phase 1 only · ~2–3 min · pennies</div>
          </label>
          <label class="mode-opt" id="modeFull" onclick="setMode('full')">
            <div class="mode-title">Full strategy</div>
            <div class="mode-desc">All 11 phases · ~30–40 min · ~$1–3</div>
          </label>
        </div>
        <div id="runNotice"></div>
        <button class="run-btn" id="runBtn" onclick="handleRun()">▶  Run Strategy</button>
      </div>
    </div>

    <!-- Output area (hidden until run) -->
    <div class="card" id="outputCard" style="display:none;">
      <div class="tab-bar" id="tabBar"></div>
      <div id="panels"></div>
      <div class="out-toolbar" id="outToolbar" style="display:none;">
        <span class="prog-label" id="outStatus"></span>
        <button class="dl-btn" onclick="downloadAll()">⬇  Download strategy (.md)</button>
      </div>
    </div>

  </main>
</div>

<script>
// ── Phase definitions ──────────────────────────────────────────
const SYSTEM_PROMPT = `You are a senior medicomarketing strategy director working inside a healthcare
communications agency. You build evidence-led, ethically sound marketing
strategies for pharmaceutical brands, medical products, and health services,
always targeted at healthcare professionals (HCPs).

Operating principles you must follow in every output:

1. Evidence first. Every strategic claim must be traceable to a piece of
   evidence (trial, real-world study, guideline, HCP insight) named in the
   working context. When evidence is missing, say so explicitly and record it
   as an evidence gap rather than inventing data. Never fabricate trial names,
   effect sizes, citations, or guideline recommendations.
2. Scientific rigour. Distinguish clearly between: brand-generated evidence,
   independent published evidence, evolving/emerging evidence, and guideline
   positions. Grade the strength of evidence when you compare sources.
3. Compliance awareness. All recommendations must be compatible with
   pharmaceutical promotion codes (e.g. local equivalents of ABPI/UCPMP/PhRMA
   codes). Flag any claim or tactic that would need medical-legal-regulatory
   (MLR) review before use. Never propose off-label promotion, inducements to
   prescribe, or disguised promotion.
4. HCP respect. Doctors change behaviour on the basis of evidence, peer
   influence, patient benefit, and practical feasibility — not pressure.
   Frame every tactic around genuine clinical value.
5. Client-ready output. Write in clean Markdown with clear headings, and use
   tables wherever the content is comparative or enumerable. Each phase output
   must stand alone as a client-facing document section while staying
   consistent with the phases before it.
6. Show your working process. Begin each phase output with a short
   "How this section was built" note (2-4 sentences) describing the reasoning
   steps taken, so the client can audit the process.`;

const PHASES = [
  { id: '01', title: 'Strategic Framing & Critical Thinking', prompt: `Phase 1 — Insightful critical thinking on the brief.

Deconstruct the client brief before any research is planned. Produce:

1. **Restated challenge** — the real commercial and clinical problem in one paragraph, separating what the client asked for from what the brand needs.
2. **First-principles questions** — the 8-12 questions that must be answered for this strategy to succeed (clinical, behavioural, market, access).
3. **Assumptions register** — a table of assumptions hidden in the brief: assumption | why it matters | risk if wrong | how we will test it.
4. **Known / unknown map** — what we know with evidence, what we believe without evidence, what we don't know at all.
5. **Working hypotheses** — 3-5 falsifiable hypotheses about why target HCPs do or do not currently adopt the product/recommendation, each linked to the research it will need.

This phase sets the intellectual frame every later phase must answer to.` },

  { id: '02', title: 'Medical & Scientific Research Criteria', prompt: `Phase 2 — Define the medical and scientific criteria that will govern the research process, with explicit sub-steps.

Produce:

1. **Research questions in PICO(S) format** — for each working hypothesis from Phase 1, a structured question: Population | Intervention | Comparator | Outcomes | Setting.
2. **Evidence inclusion / exclusion criteria** — study designs accepted, minimum quality thresholds, date limits, populations, endpoints that count (clinical, patient-reported, health-economic, safety).
3. **Evidence hierarchy** — the grading scheme to be applied (e.g. systematic reviews/meta-analyses > RCTs > large cohort/RWE > case series > expert opinion), and how brand-generated vs independent evidence will be weighted.
4. **Research process sub-steps** — a numbered, executable plan: sources to search (databases, congress abstracts, guideline bodies, registries, RWE sources), search strings/concepts, screening steps, extraction fields, quality-appraisal step, and synthesis step. Present as a table: sub-step | purpose | source/tool | output artefact | owner.
5. **Guideline scope** — which national and international guidelines are in scope and why.
6. **Safety and pharmacovigilance criteria** — what safety evidence must be captured alongside efficacy.` },

  { id: '03', title: 'Evidence Analysis & Forefront Table', prompt: `Phase 3 — Analyse and collate the relevant evidence in parallel stacked streams, then build the Evidence Forefront Table for the client.

Work stream by stream, in parallel structure (same extraction fields for each so they stack cleanly):

- Stream A: Brand-generated evidence (pivotal trials, brand RWE, post-hoc).
- Stream B: Independent existing published evidence.
- Stream C: Evolving / emerging new evidence (recent publications, congress data, ongoing trials of note).
- Stream D: Guidelines and consensus statements.
- Stream E: Health-economic and access evidence (cost, budget impact, QoL).

For each stream: summarise what exists (from the brief and working context), apply the Phase 2 criteria, grade the evidence, and note gaps.

Then produce the **EVIDENCE FOREFRONT TABLE** — the single client-facing table that stacks all streams side by side. Columns:

| Evidence item | Stream | Design & N | Key finding (with effect size where known) | Evidence grade | Relevance to strategy | Message potential | Gap / caveat / MLR flag |

Close with: (a) the 5 strongest evidence-backed strategic assets, and (b) the 5 most important evidence gaps with a recommendation for each.` },

  { id: '04', title: 'HCP Insight Analysis vs. Evidence', prompt: `Phase 4 — Analyse the insights gathered from our in-house HCPs and compare them against what the evidence shows.

Using the HCP insights supplied in the brief:

1. **Insight inventory** — table: insight | source (who/where) | strength of signal (how many HCPs, how consistent) | theme.
2. **Concordance map** — where HCP beliefs AGREE with the evidence forefront table: these are amplification opportunities.
3. **Discordance map** — where HCP beliefs CONTRADICT or lag the evidence: perception gaps. For each: the belief | what the evidence actually shows | likely origin of the gap | strategic implication.
4. **Silent zones** — evidence the HCPs never mention (unexploited assets) and HCP concerns the evidence never answers (evidence gaps to escalate).
5. **Validation plan** — which provisional insights need confirming, with whom, and by what method, before major spend is committed.` },

  { id: '05', title: 'Behaviours, Motivations & Key Drivers', prompt: `Phase 5 — List and analyse the main behaviours, concerns, motivations, and key behavioural drivers that determine whether target doctors adopt the product or recommendation-related change.

Structure the analysis with COM-B (Capability, Opportunity, Motivation → Behaviour) and produce:

1. **Current behaviour baseline** — what target HCPs actually do today in the relevant clinical decision moment (diagnosis, initiation, switch, adherence support), by segment where behaviour differs.
2. **Behaviours table** — behaviour we need | current behaviour | the change required | size of the leap.
3. **Concerns register** — clinical concerns, practical concerns, economic concerns, professional concerns.
4. **Motivations map** — what genuinely moves these doctors: better patient outcomes, confidence/certainty, peer recognition, efficiency, scientific curiosity, patient demand. Rank by segment.
5. **KEY BEHAVIOURAL DRIVERS** — the 4-6 levers with the highest leverage, each stated as: driver | evidence/insight it rests on | barrier it overcomes | how the campaign will pull it.` },

  { id: '06', title: 'Comparative Evidence Position', prompt: `Phase 6 — Compare the evidence we hold on the brand/product/service against the existing evidence base, the evolving new evidence, and the supporting guidelines — and convert that comparison into a strategic evidence position.

Produce:

1. **Four-way comparison table** — for each key clinical question / claim territory: what brand evidence says | what the established independent evidence says | what the newest/evolving evidence says | what guidelines currently say. Mark each cell as supportive / neutral / unsupportive / silent.
2. **Alignment analysis** — where all four columns align (safe, powerful message territory); where brand evidence leads guidelines; where guidelines lead brand evidence; where evolving evidence may shift the picture within the campaign window.
3. **Competitive shadow** — how the comparator/standard-of-care evidence sits against ours.
4. **Strategic evidence position statement** — one tight paragraph stating the defensible scientific ground the campaign will stand on.
5. **Evidence roadmap** — data generation or publication moves that would strengthen the position during and after the campaign.` },

  { id: '07', title: 'Core Messaging & Behaviour-Change Adaptation', prompt: `Phase 7 — Build the core messaging platform and define the behavioural change adaptation required to successfully launch and sustain the campaign.

Produce:

1. **Core messaging theme** — the single organising idea of the campaign, in one sentence, grounded in the strategic evidence position and the key behavioural drivers. Give 2 alternative framings and recommend one, with rationale.
2. **Message house** — table: pillar | core message | supporting evidence (named, from the forefront table) | behavioural driver it pulls | proof points | MLR risk level.
3. **Segment adaptations** — how the same message house flexes for each HCP segment identified earlier.
4. **Objection-handling grid** — top concerns from Phase 5 | response | evidence anchor | what NOT to say (compliance boundary).
5. **Behaviour-change adaptation plan** — launch phase (breaking the old habit: triggers, education, trial experiences) vs. sustain phase (embedding the new habit: reinforcement, feedback loops, peer norms).` },

  { id: '08', title: 'HCP Engagement Plan', prompt: `Phase 8 — Design how we engage HCPs from the beginning of the campaign to its end — and beyond it.

Produce a staged engagement journey:

1. **Stage map** — table across the arc: Pre-launch → Launch → Adoption → Reinforcement → Beyond campaign. For each stage: objective | target segments | key activities | content/evidence used | channels | who leads (medical vs. commercial) | stage exit criteria.
2. **Touchpoint choreography** — the sequence and cadence of contacts a single HCP experiences, with rules to avoid fatigue.
3. **KOL and peer-influence plan** — identification criteria, roles (steering, speaking, authorship within compliance), and how peer proof is cascaded to the wider base.
4. **Two-way engagement** — how HCP feedback, objections, and real-world experience flow back into the campaign.
5. **Beyond-the-campaign plan** — what stays alive after the funded period: communities, registries/data collaborations, education platforms.` },

  { id: '09', title: 'Activation Ideas by Segment', prompt: `Phase 9 — Generate activation idea options tailored to the HCP target's specialty, professional status, city/geography tier, the type of patients they encounter, and their sensitivity to treatment cost.

Produce:

1. **Segmentation grid** — build the practical activation segments by crossing: specialty × status (KOL / senior consultant / early-career / GP-referrer) × city tier (metro / tier-2 / tier-3-rural) × dominant patient profile × cost-of-treatment concern (low / medium / high). Collapse to the 6-10 segments that actually matter commercially.
2. **Activation menu per segment** — for each retained segment, 3-5 concrete activation ideas. For every idea: what it is | evidence & message pillar it carries | channel & format | why it fits THIS segment | effort/cost level (L/M/H) | expected effect on the key behavioural driver | compliance note.
3. **Cost-concern adaptations** — specific mechanics for high cost-concern segments.
4. **Prioritisation matrix** — impact vs. feasibility plot (as a table) across all ideas, and the recommended activation mix for Q1 vs. Q2–Q4.` },

  { id: '10', title: 'Measurement Framework', prompt: `Phase 10 — Provide the measurable metric tools to assess continuous HCP engagement and uptake of the campaign, in terms of quarterly revenue growth and the clinical and social popularity of the campaign.

Produce:

3. **Continuous HCP engagement metrics** — reach, frequency, depth, rep call quality, event attendance, digital engagement, advisory participation, share-of-voice.
4. **Clinical popularity metrics** — guideline citations, congress mentions, publication momentum, KOL sentiment, inclusion in local protocols.

  { id: '11', title: 'Executive Strategy Summary', prompt: `Phase 11 — Compile the executive strategy summary.

Condense the entire pipeline into a client-ready executive document (2-3 pages equivalent):

1. The challenge and the insight (Phases 1, 4, 5).
2. The evidence position in one table (Phases 3, 6).

];

// ── State ──────────────────────────────────────────────────────
let selectedMode = 'quick';
let running = false;
let abortCtrl = null;
let results = {}; // phaseId → text
let messages = []; // conversation history

// ── Init ───────────────────────────────────────────────────────
function init() {
  const saved = localStorage.getItem('mma_api_key');
  if (saved) {
    const el = document.getElementById('apiKey');
    el.value = saved;
    el.classList.add('ok');
  }
  document.getElementById('apiKey').addEventListener('input', function() {
    const v = this.value.trim();
    this.classList.toggle('ok', v.startsWith('sk-ant-'));
    localStorage.setItem('mma_api_key', v);
  });
  renderPhaseList();
}

function renderPhaseList() {
  const list = document.getElementById('phaseList');
  list.innerHTML = PHASES.map(p => `
    <div class="phase-item" id="pi-${p.id}" onclick="showPhaseTab('${p.id}')">
      <div class="phase-dot"></div>
      <div class="phase-name">${p.title}</div>
    </div>`).join('');
}

// ── UI helpers ─────────────────────────────────────────────────
function toggleOpt(btn) {
  const el = document.getElementById('optFields');
  const open = el.classList.toggle('open');
  btn.querySelector('span').textContent = open ? '▾' : '▸';
}

function setMode(m) {
  selectedMode = m;
  document.getElementById('modeQuick').classList.toggle('sel', m === 'quick');
  document.getElementById('modeFull').classList.toggle('sel', m === 'full');
}

function setPhaseStatus(id, status) {
  const el = document.getElementById(`pi-${id}`);
  if (!el) return;
  el.className = `phase-item ${status}`;
}

function updateProgress(done) {
  const total = selectedMode === 'quick' ? 1 : 11;
  document.getElementById('progFill').style.width = `${(done / total) * 100}%`;
  document.getElementById('progLabel').textContent = `${done} of ${total} phase${total > 1 ? 's' : ''}`;
}

function showPhaseTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const tab = document.getElementById(`tab-${id}`);
  const panel = document.getElementById(`panel-${id}`);
  if (tab) tab.classList.add('active');
  if (panel) panel.classList.add('active');
}

// ── Brief ──────────────────────────────────────────────────────
function getBriefText() {
  const get = id => document.getElementById(id)?.value?.trim() || '';
  const getLines = id => get(id).split('\n').map(s => s.trim()).filter(Boolean);

  const brief = {};
  brief.brand = get('brand');
  brief.therapy_area = get('therapy_area');
  const optMap = {
    product: get('product'), indication: get('indication'),
    market: get('market'), business_goal: get('business_goal'),
  };
  for (const [k, v] of Object.entries(optMap)) if (v) brief[k] = v;
  const listMap = {
    target_specialties: getLines('target_specialties'),
    hcp_segments: getLines('hcp_segments'),
    brand_evidence: getLines('brand_evidence'),
    hcp_insights: getLines('hcp_insights'),
    competitors: getLines('competitors'),
    constraints: getLines('constraints'),
  };
  for (const [k, v] of Object.entries(listMap)) if (v.length) brief[k] = v;

  const FIELDS = ['brand','product','therapy_area','indication','market','business_goal',
    'target_specialties','hcp_segments','brand_evidence','hcp_insights','competitors','constraints'];

  let lines = ['# CLIENT BRIEF', ''];
  for (const key of FIELDS) {
    if (!brief[key]) continue;
    lines.push(`## ${key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}`);
    const v = brief[key];
    if (Array.isArray(v)) lines.push(...v.map(x => `- ${x}`));
    else lines.push(v);
    lines.push('');
  }
  return lines.join('\n');
}

// ── Streaming ──────────────────────────────────────────────────
async function streamPhase(apiKey, userContent, onChunk) {
  messages.push({ role: 'user', content: userContent });

  const body = {
    model: 'claude-opus-5',
    max_tokens: 16000,
    stream: true,
    system: SYSTEM_PROMPT,
    messages: messages,
  };

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body),
    signal: abortCtrl?.signal,
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${resp.status}`);
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let fullText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') continue;
      try {
        const ev = JSON.parse(data);
        if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
          fullText += ev.delta.text;
          onChunk(fullText);
        }
      } catch {}
    }
  }

  messages.push({ role: 'assistant', content: fullText });
  return fullText;
}

// ── Run ────────────────────────────────────────────────────────
async function handleRun() {
  if (running) {
    abortCtrl?.abort();
    return;
  }

  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    alert('Please enter your Anthropic API key in the top-right field (starts with sk-ant-).');
    return;
  }
  if (!apiKey.startsWith('sk-ant-') && !apiKey.startsWith('sk-')) {
    alert('The API key looks wrong. It should start with sk-ant-\n\nGet one at: platform.anthropic.com → API Keys');
    return;
  }

  const brand = document.getElementById('brand').value.trim();
  const ta = document.getElementById('therapy_area').value.trim();
  if (!brand || !ta) {
    alert('Please fill in Brand name and Therapy area (both are required).');
    return;
  }

  console.log('▶ Run clicked — brand:', brand, '| therapy:', ta, '| key prefix:', apiKey.substring(0, 14) + '…');

  setNotice('', '');
  running = true;
  results = {};
  messages = [];
  abortCtrl = new AbortController();

  const btn = document.getElementById('runBtn');
  btn.textContent = '⏹  Stop';
  btn.classList.add('stop');

  const phases = selectedMode === 'quick' ? [PHASES[0]] : PHASES;

  // Build output UI
  const outputCard = document.getElementById('outputCard');
  outputCard.style.display = '';
  document.getElementById('tabBar').innerHTML = phases.map(p =>
    `<div class="tab" id="tab-${p.id}" onclick="showPhaseTab('${p.id}')">${p.title}</div>`
  ).join('');
  document.getElementById('panels').innerHTML = phases.map(p =>
    `<div class="panel md" id="panel-${p.id}"></div>`
  ).join('');
  document.getElementById('outToolbar').style.display = 'none';

  outputCard.scrollIntoView({ behavior: 'smooth', block: 'start' });

  let doneCount = 0;
  updateProgress(0);

  try {
    let first = true;
    for (const phase of phases) {
      setPhaseStatus(phase.id, 'running');
      showPhaseTab(phase.id);
      document.getElementById(`tab-${phase.id}`).classList.add('running');

      let content = phase.prompt;
      if (first) {
        content = getBriefText() + '\n\n---\n\n' + content;
        first = false;
      }

      const panel = document.getElementById(`panel-${phase.id}`);
      panel.innerHTML = '<div class="cursor"></div>';

      const text = await streamPhase(apiKey, content, (partial) => {
        panel.innerHTML = renderMd(partial) + '<span class="cursor"></span>';
      });

      panel.innerHTML = renderMd(text);
      results[phase.id] = text;
      doneCount++;

      setPhaseStatus(phase.id, 'done');
      const tab = document.getElementById(`tab-${phase.id}`);
      tab.classList.remove('running');
      tab.classList.add('done');
      updateProgress(doneCount);
    }

    document.getElementById('outToolbar').style.display = 'flex';
    document.getElementById('outStatus').textContent = `✅ ${doneCount} phase${doneCount > 1 ? 's' : ''} complete`;
    setNotice('Strategy complete — download it below.', 'info');

  } catch (err) {
    if (err.name !== 'AbortError') {
      const msg = `Error: ${err.message}`;
      console.error(msg, err);
      setNotice(msg, 'err');
      alert(msg + '\n\nOpen browser DevTools (F12 → Console) for details.');
    }
  } finally {
    running = false;
    abortCtrl = null;
    btn.textContent = '▶  Run Strategy';
    btn.classList.remove('stop');
  }
}

// ── Download ───────────────────────────────────────────────────
function downloadAll() {
  const brand = document.getElementById('brand').value.trim() || 'Brand';
  const phases = selectedMode === 'quick' ? [PHASES[0]] : PHASES;
  let md = `# Medicomarketing Strategy: ${brand}\n\n`;
  for (const p of phases) {
    if (results[p.id]) {
      md += `---\n\n## ${p.title}\n\n${results[p.id]}\n\n`;
    }
  }
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `medicomarketing-strategy-${brand.replace(/\s+/g, '-').toLowerCase()}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Notices ────────────────────────────────────────────────────
function setNotice(msg, type) {
  const el = document.getElementById('runNotice');
  el.innerHTML = msg ? `<div class="notice ${type}">${msg}</div>` : '';
}

// ── Markdown renderer ──────────────────────────────────────────
function renderMd(src) {
  if (!src) return '';
  const lines = src.split('\n');
  let html = '';
  let inUl = false, inOl = false, inCode = false, codeBuf = '', tableBuf = [], inTable = false;

  function flushList() {
    if (inUl) { html += '</ul>'; inUl = false; }
    if (inOl) { html += '</ol>'; inOl = false; }
  }
  function flushTable() {
    if (!inTable) return;
    html += '<div class="tbl"><table>';
    tableBuf.forEach((row, i) => {
      const cells = row.split('|').map(c => c.trim()).filter((_, j, a) => j > 0 && j < a.length - 1);
      if (i === 0) {
        html += '<thead><tr>' + cells.map(c => `<th>${escHtml(c)}</th>`).join('') + '</tr></thead><tbody>';
      } else if (i === 1 && row.replace(/[\s|:-]/g,'') === '') {
        // separator row - skip
      } else {
        html += '<tr>' + cells.map(c => `<td>${inlineHtml(c)}</td>`).join('') + '</tr>';
      }
    });
    html += '</tbody></table></div>';
    tableBuf = [];
    inTable = false;
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // Code fence
    if (line.startsWith('```')) {
      if (!inCode) { inCode = true; codeBuf = ''; flushList(); flushTable(); continue; }
      else { html += `<pre><code>${escHtml(codeBuf)}</code></pre>`; inCode = false; continue; }
    }
    if (inCode) { codeBuf += (codeBuf ? '\n' : '') + line; continue; }

    // Table
    if (line.includes('|')) {
      flushList();
      inTable = true;
      tableBuf.push(line);
      continue;
    } else if (inTable) { flushTable(); }

    // HR
    if (/^[-*_]{3,}$/.test(line.trim())) { flushList(); html += '<hr>'; continue; }

    // Headings
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushList(); html += `<h${h[1].length}>${inlineHtml(h[2])}</h${h[1].length}>`; continue; }

    // Unordered list
    const ul = line.match(/^[\s]*[-*+]\s+(.*)/);
    if (ul) { if (!inUl) { if (inOl) { html += '</ol>'; inOl = false; } html += '<ul>'; inUl = true; } html += `<li>${inlineHtml(ul[1])}</li>`; continue; }

    // Ordered list
    const ol = line.match(/^[\s]*\d+\.\s+(.*)/);
    if (ol) { if (!inOl) { if (inUl) { html += '</ul>'; inUl = false; } html += '<ol>'; inOl = true; } html += `<li>${inlineHtml(ol[1])}</li>`; continue; }

    flushList();

    // Blank line
    if (line.trim() === '') continue;

    // Blockquote
    const bq = line.match(/^>\s*(.*)/);
    if (bq) { html += `<blockquote><p>${inlineHtml(bq[1])}</p></blockquote>`; continue; }

    html += `<p>${inlineHtml(line)}</p>`;
  }
  flushList();
  flushTable();
  if (inCode) html += `<pre><code>${escHtml(codeBuf)}</code></pre>`;
  return `<div class="md">${html}</div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function inlineHtml(s) {
  s = escHtml(s);
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/_(.+?)_/g, '<em>$1</em>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}

init();
